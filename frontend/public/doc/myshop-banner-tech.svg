    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27d5e8"/><stop offset="1" stop-color="#5650f5"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#05091c" flood-opacity=".5"/></filter>
