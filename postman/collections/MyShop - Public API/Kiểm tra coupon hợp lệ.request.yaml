$kind: http-request
description: Cần điền coupon_code hợp lệ đang active trong dữ liệu test.
url: "{{base_url}}/api/coupons/validate"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{coupon_code}}",
      "subtotal": 1000000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      pm.test("Coupon hop le co discount_amount", function () { pm.expect(pm.response.json().data).to.have.property("discount_amount"); });
    language: text/javascript
order: 13000
