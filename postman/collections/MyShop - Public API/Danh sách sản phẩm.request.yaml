$kind: http-request
url: "{{base_url}}/api/products"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      pm.test("Co danh sach data va pagination", function () { const b=pm.response.json(); pm.expect(b).to.have.property("data"); pm.expect(b).to.have.property("pagination"); });
    language: text/javascript
order: 1000
