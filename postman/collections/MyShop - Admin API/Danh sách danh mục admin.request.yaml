$kind: http-request
url: "{{base_url}}/api/admin/categories"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 4000
