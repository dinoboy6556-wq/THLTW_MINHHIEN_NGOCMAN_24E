$kind: http-request
description: Cần chạy trước Tạo danh mục. ID danh mục và brand được lấy từ các request trước.
url: "{{base_url}}/api/admin/products"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{product_name}}",
      "cate_id": "{{category_id}}",
      "brand_id": "{{brand_id}}",
      "price": 250000,
      "promo_price": 200000,
      "stock": 10,
      "thumbnail": null,
      "description": "San pham tao boi Postman",
      "status": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      const b=pm.response.json(); if (b.data && b.data.id) pm.collectionVariables.set("product_id", b.data.id);
    language: text/javascript
order: 8000
