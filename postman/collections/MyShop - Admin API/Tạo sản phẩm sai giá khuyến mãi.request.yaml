$kind: http-request
url: "{{base_url}}/api/admin/products"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "San pham loi gia {{timestamp}}",
      "cate_id": "{{category_id}}",
      "brand_id": null,
      "price": 100000,
      "promo_price": 150000,
      "stock": 2,
      "status": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422", function () { pm.response.to.have.status(422); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 9000
