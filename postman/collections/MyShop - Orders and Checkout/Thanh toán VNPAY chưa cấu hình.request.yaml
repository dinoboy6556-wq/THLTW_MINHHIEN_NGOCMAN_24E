$kind: http-request
description: Chỉ chạy khi VNPAY chưa được cấu hình; nếu đã cấu hình, bỏ qua test này.
url: "{{base_url}}/api/orders"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cus_name": "member_username",
      "cus_email": "{{member_email}}",
      "cus_phone": "0901234567",
      "cus_address": "Dia chi kiem thu",
      "payment_method": "vnpay",
      "items": [
        {
          "product_id": "{{product_id}}",
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 503", function () { pm.response.to.have.status(503); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 5000
