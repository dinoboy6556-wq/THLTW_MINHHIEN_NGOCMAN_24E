$kind: http-request
description: Tạo đơn thật trên database và giảm tồn kho. Chỉ chạy trên môi trường test với sản phẩm còn hàng.
url: "{{base_url}}/api/orders"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cus_name": "{{member_username}}",
      "cus_email": "{{member_email}}",
      "cus_phone": "0901234567",
      "cus_address": "Dia chi kiem thu",
      "payment_method": "cod",
      "items": [
        {
          "product_id": "{{product_id}}",
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      const b=pm.response.json(); if (b.data && b.data.id) pm.collectionVariables.set("order_id", b.data.id);
    language: text/javascript
order: 2000
