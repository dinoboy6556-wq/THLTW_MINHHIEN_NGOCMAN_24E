$kind: http-request
description: Lần gửi đầu trả 201; review tạo mới ở trạng thái pending, chờ admin duyệt.
url: "{{base_url}}/api/products/{{product_id}}/reviews"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": 5,
      "comment": "San pham tot, dung nhu mo ta."
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      const b=pm.response.json(); if (b.data && b.data.id) pm.collectionVariables.set("review_id", b.data.id);
    language: text/javascript
order: 7000
