$kind: http-request
description: Cần order_id thuộc member_token và đơn ở trạng thái cho phép gửi yêu cầu.
url: "{{base_url}}/api/my-orders/{{order_id}}/requests"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "type": "cancel",
      "reason": "Yeu cau huy don kiem thu"
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 9000
