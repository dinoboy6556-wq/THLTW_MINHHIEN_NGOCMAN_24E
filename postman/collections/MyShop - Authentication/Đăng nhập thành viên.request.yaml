$kind: http-request
description: Chạy sau Đăng ký tài khoản mới hoặc điền member_email/member_password đã tồn tại.
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "login": "{{member_email}}",
      "password": "{{member_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
      const b=pm.response.json(); if (b.access_token) pm.collectionVariables.set("member_token", b.access_token);
    language: text/javascript
order: 2000
