$kind: http-request
description: Dùng hồ sơ test vừa đăng ký; endpoint yêu cầu username/email.
url: "{{base_url}}/api/profile"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{member_username}}",
      "email": "{{member_email}}",
      "phone": "0901234567",
      "address": "Dia chi test da cap nhat"
    }
auth:
  type: bearer
  credentials:
    token: "{{member_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Response la JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 5000
